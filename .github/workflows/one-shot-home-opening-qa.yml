name: One-shot Home Opening QA

on:
  push:
    branches:
      - portfolio/art-practice-reframe-20260923

jobs:
  home-opening-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install one-shot Playwright runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npm start > /tmp/omar-portfolio.log 2>&1 &
          echo $! > /tmp/omar-portfolio.pid
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/omar-portfolio.log
          exit 1

      - name: Capture and inspect real Home opening
        run: node scripts/qa-home-opening.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-opening-qa
          path: qa-output/
          if-no-files-found: warn
